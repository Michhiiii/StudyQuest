<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyQuest - Gamifizierte Lernverwaltung</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/quest.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <!-- Single Page App Container -->
    <div id="app">
        <!-- Wird dynamisch gefüllt von app.js -->
    </div>

    <!-- Navigation (nur sichtbar wenn logged in) -->
    <nav id="navbar" class="navbar hidden">
        <div class="nav-container">
            <div class="nav-brand">StudyQuest</div>
            <div class="nav-menu">
                <button id="nav-dashboard" class="nav-link">Dashboard</button>
                <button id="nav-quests" class="nav-link">Quests</button>
                <button id="nav-profile" class="nav-link">Profil</button>
                <div class="nav-notifications">
                    <button id="nav-notifications-bell" class="nav-link notification-bell">
                        🔔
                        <span id="notification-badge" class="notification-badge hidden">0</span>
                    </button>
                    <div id="notification-dropdown" class="notification-dropdown hidden">
                        <div class="notification-header">
                            <h3>Benachrichtigungen</h3>
                            <button id="clear-notifications-btn" class="btn-clear">✕</button>
                        </div>
                        <div id="notification-list" class="notification-list"></div>
                    </div>
                </div>
                <button id="nav-logout" class="nav-link logout-btn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- JavaScript Module -->
    <script src="js/db.js"></script>
    <script src="js/user.js"></script>
    <script src="js/quest.js"></script>
    <script src="js/grade.js"></script>
    <script src="js/notification.js"></script>
    <script src="js/achievement.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
